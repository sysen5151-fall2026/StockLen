name: Evidence functional requirements
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functional-requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r walking_skeleton/backend/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_pmc2_http.py
