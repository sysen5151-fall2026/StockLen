name: Verify and publish StockLens
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stocklens-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r walking_skeleton/backend/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_http.py
      - run: python scripts/check_baseline.py
      - run: node --test tests/site.test.mjs
      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site
      - name: Check Pages configuration
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            let enabled = false;
            let message;
            try {
              const {data} = await github.rest.repos.getPages(context.repo);
              enabled = data.build_type === 'workflow';
              message = enabled ? 'Pages is configured for GitHub Actions.' : 'Deployment skipped: select GitHub Actions as the Pages source.';
            } catch (error) {
              if (error.status !== 404) throw error;
              message = 'Deployment skipped: GitHub Pages is not enabled or is unavailable to this workflow.';
            }
            core.setOutput('enabled', String(enabled));
            if (!enabled) core.notice(message);
            await core.summary.addHeading('Website publishing').addRaw(message + '\n\n')
              .addLink('Pages settings', `https://github.com/${context.repo.owner}/${context.repo.repo}/settings/pages`).write();
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify.outputs.pages_enabled == 'true'
    needs: verify
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
