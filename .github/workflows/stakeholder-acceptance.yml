name: Stakeholder acceptance readiness
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_strict_assessment:
        description: 'Run the strict acceptance scaffold (fails while evidence is missing)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  readiness-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_baseline.py
      - name: Report pending assessments (not an acceptance pass)
        run: python scripts/report_acceptance.py
      - name: Strict assessment (expected to fail until evidence exists)
        if: github.event_name == 'workflow_dispatch' && inputs.run_strict_assessment
        run: python -m unittest discover -s acceptance -v
