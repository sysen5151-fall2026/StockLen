        "operationId": "requestDatedRecords",
        "summary": "F.2.1 Request Dated Market and News Records",
        "x-function-id": "F.2.1",
        "x-decomposes": "F.2",
        "x-internal": true,
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AcquisitionInput"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Controlled function result; failed evidence is a normal typed result, not HTTP success of scoring",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AcquisitionResult"
                }
              }
            }
          },
          "422": {
            "description": "Malformed input or rejected precondition"
          }
        }
      }
    },
    "/internal/f2/validate": {
      "post": {
        "operationId": "validateEvidence",
        "summary": "F.2.2 Validate Evidence Dates and Provenance",
        "x-function-id": "F.2.2",
        "x-decomposes": "F.2",
        "x-internal": true,
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ValidationInput"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Controlled function result; failed evidence is a normal typed result, not HTTP success of scoring",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EvidenceResult"
                }
              }
            }
          },
          "422": {
            "description": "Malformed input or rejected precondition"
          }
        }
      }
    }
